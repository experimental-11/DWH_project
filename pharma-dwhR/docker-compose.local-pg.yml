# Use THIS file if Postgres is already installed on your computer.
# Docker only runs Airflow + Grafana; they connect to your own Postgres on port 5432.
#
# Start:  docker compose -f docker-compose.local-pg.yml up -d
# Stop:   docker compose -f docker-compose.local-pg.yml down

services:
  airflow:
    image: apache/airflow:2.10.5-python3.11
    container_name: pharma_airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach your computer
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      # your local Postgres (user dwh / password dwh / database pharma_dwh)
      AIRFLOW_CONN_PHARMA_DWH: postgres://dwh:dwh@host.docker.internal:5432/pharma_dwh
      PYTHONPATH: /opt/airflow/include
      PHARMA_DATA_DIR: /opt/airflow/data
      PHARMA_SQL_DIR: /opt/airflow/sql
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pharma_grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning-localpg:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

volumes:
  airflow_home:
  grafana_data:
