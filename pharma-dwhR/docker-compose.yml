# Pharma Cold Chain DWH - local stack
#   postgres : the warehouse (staging / dwh / audit schemas) + Airflow's own metadata DB
#   airflow  : scheduler + webserver in one container ("standalone" mode)
#   grafana  : DE observability dashboards (batch / stream / storage / query)
#
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (DELETES the warehouse volume)

services:
  postgres:
    image: postgres:16
    container_name: pharma_postgres
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: pharma_dwh
    ports:
      - "5433:5432"          # host port 5433 so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_init_airflow_db.sql:/docker-entrypoint-initdb.d/00_init_airflow_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d pharma_dwh"]
      interval: 5s
      retries: 20

  airflow:
    image: apache/airflow:2.10.5-python3.11
    container_name: pharma_airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      # Connection used by every task: conn_id = pharma_dwh
      AIRFLOW_CONN_PHARMA_DWH: postgres://dwh:dwh@postgres:5432/pharma_dwh
      PYTHONPATH: /opt/airflow/include
      PHARMA_DATA_DIR: /opt/airflow/data
      PHARMA_SQL_DIR: /opt/airflow/sql
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - airflow_home:/opt/airflow/logs

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pharma_grafana
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  airflow_home:
  grafana_data:
